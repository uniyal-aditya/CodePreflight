services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    mem_limit: 1g
  web:
    build:
      context: ./frontend
      args:  # read from .env (or your shell) at build time
        VITE_API_URL: ${VITE_API_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports: ["8080:8080"]
